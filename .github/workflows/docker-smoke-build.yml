name: Docker Smoke Build

on:
  workflow_call:
    inputs:
      image_name:
        description: "Local image tag used for the smoke build/scan (never pushed anywhere)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      platforms:
        description: "Comma-separated platforms to smoke-build (e.g. linux/amd64,linux/arm64). Each platform builds natively on its own runner (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) — no QEMU emulation. Requires arm64 hosted runners to be available to the caller for the linux/arm64 leg."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      scan_image:
        description: "Scan the image with Trivy and fail this check on a CRITICAL vulnerability that has a known fix. This is the pipeline's ONLY blocking scan — the release-train/docker-release scan is report-only, so a CVE published after this PR merges never fails an unrelated release later. Runs once, on the linux/amd64 leg."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # security-events: write is required ONLY when scan_image=true, to upload
  # the Trivy SARIF report. Callers that enable scan_image must also declare
  # security-events: write themselves for the permission to reach this job.
  security-events: write

jobs:
  # Maps each requested platform to the native runner that builds it without
  # QEMU emulation, so `docker` below can fan out into one job per platform.
  matrix:
    name: Resolve platform matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      - name: Map platforms to native runners
        id: build
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          include="[]"
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for raw in "${PLATS[@]}"; do
            p="$(echo "$raw" | xargs)"
            case "$p" in
              linux/amd64) runner="ubuntu-latest" ;;
              linux/arm64) runner="ubuntu-24.04-arm" ;;
              *)
                echo "::error::Unsupported platform '$p'. Supported: linux/amd64, linux/arm64."
                exit 1
                ;;
            esac
            include=$(echo "$include" | jq -c --arg platform "$p" --arg runner "$runner" '. + [{"platform": $platform, "runner": $runner}]')
          done
          echo "include=$include" >> "$GITHUB_OUTPUT"

  docker:
    name: Smoke build (${{ matrix.platform }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 is the only leg that can `load` a single-arch image into the
      # local Docker daemon, so it's also the one used for the vulnerability
      # scan below — no separate scan-only build needed.
      - name: Build image (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ inputs.scan_image && matrix.platform == 'linux/amd64' }}
          tags: ${{ inputs.image_name }}:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Scan image for vulnerabilities
        if: inputs.scan_image && matrix.platform == 'linux/amd64'
        uses: sisques-labs/workflows/.github/actions/trivy-scan@main
        with:
          image_ref: ${{ inputs.image_name }}:smoke
          block_on_critical: "true"
