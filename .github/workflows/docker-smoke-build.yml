name: Docker Smoke Build

on:
  workflow_call:
    inputs:
      image_name:
        description: "Local image tag used for the smoke build/scan (never pushed anywhere)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      platforms:
        description: "Target platforms to smoke-build (e.g. linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      scan_image:
        description: "Scan the image with Trivy and fail this check on a CRITICAL vulnerability that has a known fix. This is the pipeline's ONLY blocking scan — the release-train/docker-release scan is report-only, so a CVE published after this PR merges never fails an unrelated release later."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # security-events: write is required ONLY when scan_image=true, to upload
  # the Trivy SARIF report. Callers that enable scan_image must also declare
  # security-events: write themselves for the permission to reach this job.
  security-events: write

jobs:
  docker:
    name: Smoke build (buildx, no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same reasoning as docker-release.yml: multi-arch builds with
      # push:false aren't docker-loadable, so this builds a linux/amd64-only
      # copy with load:true purely to scan. Reuses the buildx cache the smoke
      # build below also reads from, so the extra build is cheap.
      - name: Build image for vulnerability scan (linux/amd64)
        if: inputs.scan_image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ inputs.image_name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        if: inputs.scan_image
        uses: sisques-labs/workflows/.github/actions/trivy-scan@main
        with:
          image_ref: ${{ inputs.image_name }}:scan
          block_on_critical: "true"

      - name: Build image (smoke test all platforms)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: false
          tags: ${{ inputs.image_name }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
