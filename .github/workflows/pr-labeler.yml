name: PR Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        description: "Path (in the consumer repo) to the labeler config file"
        type: string
        default: ".github/labeler.yml"
      sync-labels:
        description: "Remove a label when the PR no longer touches matching files"
        type: boolean
        default: true

jobs:
  label:
    name: Label PR by changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "documentation", color: "0075ca", description: "Docs-only changes" },
              { name: "tests", color: "44cfe0", description: "Test-only changes" },
              { name: "ci", color: "1d76db", description: "CI/CD workflow changes" },
              { name: "dependencies", color: "0366d6", description: "Dependency updates" },
              { name: "docker", color: "2496ed", description: "Docker/container changes" },
              { name: "config", color: "fbca04", description: "Config/tooling changes" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

      - name: Label PR by changed files
        uses: actions/labeler@v5
        with:
          configuration-path: ${{ inputs.configuration-path }}
          sync-labels: ${{ inputs.sync-labels }}
