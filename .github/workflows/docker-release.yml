name: Docker Release

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker Hub image name (e.g. sisqueslabs/prompt-service)"
        required: true
        type: string
      version:
        description: "Version bump type for legacy/manual mode (patch | minor | major)"
        required: false
        type: string
        default: patch
      release_type:
        description: "Release type (stable | alpha | beta | rc)"
        required: false
        type: string
        default: stable
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      run_lint:
        description: "Whether to run lint before building"
        required: false
        type: boolean
        default: true
      run_test:
        description: "Whether to run tests before building"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      push_ghcr:
        description: "Also publish the image to GitHub Container Registry (GHCR)"
        required: false
        type: boolean
        default: false
      ghcr_image_name:
        description: "GHCR image name (e.g. ghcr.io/sisques-labs/aws-local-ui). Required when push_ghcr=true."
        required: false
        type: string
        default: ""
      bump_mode:
        description: "Version bump mode (legacy | release-train)"
        required: false
        type: string
        default: legacy
      next_version:
        description: "Exact version to publish (required when bump_mode=release-train, computed by release-train-detect)"
        required: false
        type: string
        default: ""
      sync_develop_after_stable:
        description: "After a stable release-train graduate, merge main into develop"
        required: false
        type: boolean
        default: false
      dockerhub_readme_path:
        description: "Path (in the consumer's checkout) to the README used as the Docker Hub repository description. Defaults to docker/README.md; the sync is skipped without failing if the file doesn't exist there — not all consumers have this file yet."
        required: false
        type: string
        default: "docker/README.md"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      NODE_AUTH_TOKEN:
        description: "GitHub token with read:packages scope for @sisques-labs private packages"
        required: false

permissions:
  contents: write
  # packages: write is required ONLY when push_ghcr=true; declaring it at the
  # reusable workflow level is safe — callers that don't enable GHCR simply
  # never exercise the login step. Callers MUST still declare packages: write
  # in the consumer workflow for the permission to be granted to GITHUB_TOKEN.
  packages: write

jobs:
  release:
    name: Version, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.push_ghcr }}" = "true" ] && [ -z "${{ inputs.ghcr_image_name }}" ]; then
            echo "::error::push_ghcr=true requires a non-empty ghcr_image_name input."
            exit 1
          fi
          if [ "${{ inputs.bump_mode }}" = "release-train" ] && [ -z "${{ inputs.next_version }}" ]; then
            echo "::error::bump_mode=release-train requires a non-empty next_version input."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Configure npm for private packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
            echo "@sisques-labs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        run: pnpm lint

      - name: Test
        if: inputs.run_test
        run: pnpm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Release-train mode: the exact version was computed from git tags by
      # release-train-detect. Apply it verbatim — package.json is a mirror of
      # the tag state, never the source of truth.
      - name: Set version (release train)
        if: inputs.bump_mode == 'release-train'
        id: bump_train
        run: |
          NEW_VERSION=$(npm version "${{ inputs.next_version }}" --no-git-tag-version --allow-same-version)
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # Legacy mode: manual workflow_dispatch releases bump relative to the
      # version currently in package.json.
      - name: Bump version (legacy)
        if: inputs.bump_mode != 'release-train'
        id: bump_legacy
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
          else
            NEW_VERSION=$(npm version pre${{ inputs.version }} --preid=${{ inputs.release_type }} --no-git-tag-version)
          fi
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Export version outputs
        id: bump
        run: |
          if [ "${{ inputs.bump_mode }}" = "release-train" ]; then
            echo "version=${{ steps.bump_train.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.bump_train.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.bump_legacy.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.bump_legacy.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against duplicate tag
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          git fetch origin "refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists. Refusing to publish a duplicate release."
            exit 1
          fi

      - name: Detect cliff.toml
        id: cliff_detect
        run: |
          if [ -f cliff.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # Pre-release tags (alpha/beta/rc) are collapsed so the file mirrors the
      # release notes: all work that flowed through the pre-releases of a
      # version lands under a single stable section instead of being scattered
      # across the alpha entries (which leaves the stable entry empty, since the
      # graduation commits carry no new changes). The regex is single-quoted
      # because git-cliff-action splices these args into a bash command line.
      - name: Generate CHANGELOG.md (full history)
        if: steps.cliff_detect.outputs.present == 'true' && github.ref_name == 'main'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ steps.bump.outputs.tag }} --ignore-tags '.*-(alpha|beta|rc).*'
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # Stable releases accumulate everything shipped since the PREVIOUS
      # stable release into a single flat section — the work that flowed
      # through alpha/beta would otherwise be attributed to the pre-release
      # entries and leave the stable notes nearly empty. Pre-releases keep
      # covering only what is new since the last tag.
      - name: Determine release notes range
        if: steps.cliff_detect.outputs.present == 'true' && github.ref_name == 'main'
        id: notes_range
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            PREV_STABLE=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            # The regex is single-quoted because git-cliff-action splices
            # these args into a bash command line.
            if [ -n "$PREV_STABLE" ]; then
              echo "args=--ignore-tags '.*-(alpha|beta|rc).*' ${PREV_STABLE}..HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "args=--ignore-tags '.*-(alpha|beta|rc).*'" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "args=--unreleased" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body fragment
        if: steps.cliff_detect.outputs.present == 'true' && github.ref_name == 'main'
        id: cliff_body
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --strip header --tag ${{ steps.bump.outputs.tag }} ${{ steps.notes_range.outputs.args }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compute tag list
        id: tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME: ${{ inputs.ghcr_image_name }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Build a newline-separated list of fully-qualified image refs.
          # Stable releases get :X.Y.Z + :latest on every enabled registry.
          # Pre-releases get :X.Y.Z-<type>.N + :<type> and never touch :latest.
          {
            echo "list<<TAGS_EOF"
            if [ "${RELEASE_TYPE}" = "stable" ]; then
              echo "${IMAGE_NAME}:${VERSION}"
              echo "${IMAGE_NAME}:latest"
              if [ "${PUSH_GHCR}" = "true" ]; then
                echo "${GHCR_IMAGE_NAME}:${VERSION}"
                echo "${GHCR_IMAGE_NAME}:latest"
              fi
            else
              echo "${IMAGE_NAME}:${VERSION}"
              echo "${IMAGE_NAME}:${RELEASE_TYPE}"
              if [ "${PUSH_GHCR}" = "true" ]; then
                echo "${GHCR_IMAGE_NAME}:${VERSION}"
                echo "${GHCR_IMAGE_NAME}:${RELEASE_TYPE}"
              fi
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build first WITHOUT pushing: if the image cannot be built, nothing is
      # published anywhere (no git tag, no registry tag, no GitHub Release).
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish to git BEFORE the registries: the git tag is the source of
      # truth for the next version computation, so it must never lag behind
      # a published image. The atomic push guarantees the release commit and
      # its tag land together or not at all.
      - name: Commit, tag & push
        env:
          HUSKY: "0"
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          if [ "${{ github.ref_name }}" == "main" ]; then
            git add package.json pnpm-lock.yaml
            if [ -f package-lock.json ]; then git add package-lock.json; fi
            if [ -f CHANGELOG.md ] && [ -f cliff.toml ]; then git add CHANGELOG.md; fi
            git diff --staged --quiet || git commit -m "chore(release): ${TAG}"
          fi
          git tag "${TAG}"
          for attempt in 1 2 3; do
            if git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/${TAG}"; then
              exit 0
            fi
            echo "git push failed (attempt ${attempt}), retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
            git fetch origin "${{ github.ref_name }}"
            if ! git merge-base --is-ancestor "origin/${{ github.ref_name }}" HEAD; then
              echo "::error::Branch ${{ github.ref_name }} moved during the release. Aborting; the next push will release these changes."
              exit 1
            fi
          done
          echo "::error::Failed to push release commit and tag after 3 attempts."
          exit 1

      # The registry push reuses the buildx cache from the build step, so this
      # is a near-instant publish of the exact image that was just built.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha

      # By the time this step runs, "Push image" has already succeeded (a
      # failed push stops the job before reaching here), so image_name was
      # published and the Docker Hub login above is known-good — no separate
      # "did we actually publish" check is needed.
      #
      # NOTE: peter-evans/dockerhub-description requires a Docker Hub
      # password/PAT with Read/Write/Delete scope. A token scoped only for
      # `docker login` + image push (Read & Write) is NOT sufficient and will
      # make this step fail with 401/403 — see README for details.
      - name: Check Docker Hub README exists
        id: readme_check
        if: inputs.release_type == 'stable' && inputs.dockerhub_readme_path != ''
        run: |
          if [ -f "${{ inputs.dockerhub_readme_path }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dockerhub_readme_path was set to '${{ inputs.dockerhub_readme_path }}' but the file was not found in the checkout — skipping Docker Hub description sync."
          fi

      - name: Sync Docker Hub description
        if: inputs.release_type == 'stable' && inputs.dockerhub_readme_path != '' && steps.readme_check.outputs.exists == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ inputs.image_name }}
          readme-filepath: ${{ inputs.dockerhub_readme_path }}

      - name: Sync stable to develop
        if: inputs.sync_develop_after_stable
        env:
          HUSKY: "0"
        run: |
          git fetch origin develop
          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "develop branch does not exist yet — skipping sync"
            exit 0
          fi
          git checkout develop
          git merge "${{ steps.bump.outputs.tag }}" -m "chore(release): sync stable ${{ steps.bump.outputs.tag }} from main"
          git push origin develop

      - name: Create GitHub Release (git-cliff)
        if: steps.cliff_detect.outputs.present == 'true' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ inputs.release_type != 'stable' }}

      - name: Create GitHub Release
        if: steps.cliff_detect.outputs.present != 'true' || github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type != 'stable' }}
