name: Docker Release

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker Hub image name (e.g. sisqueslabs/prompt-service)"
        required: true
        type: string
      version:
        description: "Version bump type (patch | minor | major)"
        required: true
        type: string
      release_type:
        description: "Release type (stable | alpha | beta | rc)"
        required: false
        type: string
        default: stable
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      run_lint:
        description: "Whether to run lint before building"
        required: false
        type: boolean
        default: true
      run_test:
        description: "Whether to run tests before building"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      push_ghcr:
        description: "Also publish the image to GitHub Container Registry (GHCR)"
        required: false
        type: boolean
        default: false
      ghcr_image_name:
        description: "GHCR image name (e.g. ghcr.io/sisques-labs/aws-local-ui). Required when push_ghcr=true."
        required: false
        type: string
        default: ""
      bump_mode:
        description: "Version bump mode (legacy | release-train)"
        required: false
        type: string
        default: legacy
      bump_strategy:
        description: "Release-train bump strategy (open-cycle | prerelease-alpha | promote-beta | prerelease-beta | graduate)"
        required: false
        type: string
        default: ""
      sync_develop_after_stable:
        description: "After a stable release-train graduate, merge main into develop"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      NODE_AUTH_TOKEN:
        description: "GitHub token with read:packages scope for @sisques-labs private packages"
        required: false

permissions:
  contents: write
  # packages: write is required ONLY when push_ghcr=true; declaring it at the
  # reusable workflow level is safe — callers that don't enable GHCR simply
  # never exercise the login step. Callers MUST still declare packages: write
  # in the consumer workflow for the permission to be granted to GITHUB_TOKEN.
  packages: write

jobs:
  release:
    name: Version, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Validate GHCR inputs
        if: inputs.push_ghcr && inputs.ghcr_image_name == ''
        run: |
          echo "::error::push_ghcr=true requires a non-empty ghcr_image_name input."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Configure npm for private packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
            echo "@sisques-labs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        run: pnpm lint

      - name: Test
        if: inputs.run_test
        run: pnpm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (release train)
        if: inputs.bump_mode == 'release-train'
        id: bump_train
        uses: sisques-labs/workflows/.github/actions/release-train-bump@main
        with:
          bump_strategy: ${{ inputs.bump_strategy }}
          version_bump: ${{ inputs.version }}

      - name: Bump version (legacy)
        if: inputs.bump_mode != 'release-train'
        id: bump_legacy
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
          else
            NEW_VERSION=$(npm version pre${{ inputs.version }} --preid=${{ inputs.release_type }} --no-git-tag-version)
          fi
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Export version outputs
        id: bump
        run: |
          if [ "${{ inputs.bump_mode }}" = "release-train" ]; then
            echo "version=${{ steps.bump_train.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.bump_train.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.bump_legacy.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.bump_legacy.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against duplicate tag
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists on origin. Refusing to publish a duplicate release."
            exit 1
          fi

      - name: Detect cliff.toml
        id: cliff_detect
        run: |
          if [ -f cliff.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate CHANGELOG.md (full history)
        if: steps.cliff_detect.outputs.present == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release body fragment
        if: steps.cliff_detect.outputs.present == 'true'
        id: cliff_body
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased --strip header --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compute tag list
        id: tags
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME: ${{ inputs.ghcr_image_name }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Build a newline-separated list of fully-qualified image refs.
          # Stable releases get :X.Y.Z + :latest on every enabled registry.
          # Pre-releases get :X.Y.Z-<type>.N + :<type> and never touch :latest.
          {
            echo "list<<TAGS_EOF"
            if [ "${RELEASE_TYPE}" = "stable" ]; then
              echo "${IMAGE_NAME}:${VERSION}"
              echo "${IMAGE_NAME}:latest"
              if [ "${PUSH_GHCR}" = "true" ]; then
                echo "${GHCR_IMAGE_NAME}:${VERSION}"
                echo "${GHCR_IMAGE_NAME}:latest"
              fi
            else
              echo "${IMAGE_NAME}:${VERSION}"
              echo "${IMAGE_NAME}:${RELEASE_TYPE}"
              if [ "${PUSH_GHCR}" = "true" ]; then
                echo "${GHCR_IMAGE_NAME}:${VERSION}"
                echo "${GHCR_IMAGE_NAME}:${RELEASE_TYPE}"
              fi
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit, tag & push
        env:
          HUSKY: "0"
        run: |
          git add package.json pnpm-lock.yaml
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          if [ -f CHANGELOG.md ] && [ -f cliff.toml ]; then git add CHANGELOG.md; fi
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin HEAD --follow-tags

      - name: Sync stable to develop
        if: inputs.sync_develop_after_stable
        env:
          HUSKY: "0"
        run: |
          git fetch origin develop
          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "develop branch does not exist yet — skipping sync"
            exit 0
          fi
          git checkout develop
          git merge "${{ steps.bump.outputs.tag }}" -m "chore: sync stable ${{ steps.bump.outputs.tag }} from main"
          git push origin develop

      - name: Create GitHub Release (git-cliff)
        if: steps.cliff_detect.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ inputs.release_type != 'stable' }}

      - name: Create GitHub Release
        if: steps.cliff_detect.outputs.present != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type != 'stable' }}
