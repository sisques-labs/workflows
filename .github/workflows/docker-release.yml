name: Docker Release

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker Hub image name (e.g. sisqueslabs/prompt-service)"
        required: true
        type: string
      version:
        description: "Version bump type"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: false
        type: string
        default: stable
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      run_lint:
        description: "Whether to run lint before building"
        required: false
        type: boolean
        default: true
      run_test:
        description: "Whether to run tests before building"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      NODE_AUTH_TOKEN:
        description: "GitHub token with read:packages scope for @sisques-labs private packages"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Version, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Configure npm for private packages
        if: secrets.NODE_AUTH_TOKEN != ''
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" >> ~/.npmrc
          echo "@sisques-labs:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        run: pnpm lint

      - name: Test
        if: inputs.run_test
        run: pnpm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
          else
            NEW_VERSION=$(npm version pre${{ inputs.version }} --preid=${{ inputs.release_type }} --no-git-tag-version)
          fi
          # Strip the leading 'v'
          echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (stable)
        if: inputs.release_type == 'stable'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:${{ steps.bump.outputs.version }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (pre-release)
        if: inputs.release_type != 'stable'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.release_type }}
            ${{ inputs.image_name }}:${{ steps.bump.outputs.version }}
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit, tag & push
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type != 'stable' }}
