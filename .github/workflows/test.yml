name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-train-detect:
    name: Release train detect tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run tests
        run: bash tests/release-train-detect.test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Lint shell scripts
        run: |
          shopt -s globstar nullglob
          shellcheck .github/actions/**/*.sh tests/*.sh
