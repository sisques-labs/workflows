name: Node Release

on:
  workflow_call:
    inputs:
      app_path:
        description: "Path to the app/package (e.g., packages/sdk, apps/api). Use '.' for root"
        required: false
        type: string
        default: "."
      working_directory:
        description: "Working directory for semantic-release (defaults to app_path)"
        required: false
        type: string
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      pnpm_version:
        description: "pnpm version to use (leave empty to auto-detect from package.json)"
        required: false
        type: string
        default: ""
      use_filter:
        description: "Whether to use filter when installing dependencies"
        required: false
        type: boolean
        default: false
      build_command:
        description: "Build command to run before release (optional)"
        required: false
        type: string
      release_command:
        description: "Custom release command (defaults to 'pnpm release' or 'npx semantic-release')"
        required: false
        type: string
      sync_develop_after_stable:
        description: "After a stable release on main, merge main back into develop so it never diverges on package.json/CHANGELOG.md. No-op if develop doesn't exist or nothing was released."
        required: false
        type: boolean
        default: false
      sync_staging_after_stable:
        description: "After a stable release on main, merge main back into staging so it never diverges on package.json/CHANGELOG.md. No-op if staging doesn't exist or nothing was released."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: sisques-labs/workflows/.github/actions/setup@main
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        uses: sisques-labs/workflows/.github/actions/install@main
        with:
          app_path: ${{ inputs.app_path }}
          use_filter: ${{ inputs.use_filter }}
          frozen_lockfile: "true"

      - name: Build
        if: inputs.build_command
        run: |
          if [[ "${{ inputs.app_path }}" != "." && "${{ inputs.use_filter }}" == "true" ]]; then
            pnpm --filter=./${{ inputs.app_path }}... ${{ inputs.build_command }}
          else
            pnpm ${{ inputs.build_command }}
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: semantic_release
        working-directory: ${{ inputs.working_directory || inputs.app_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Alias for consumers whose .npmrc references ${NODE_AUTH_TOKEN}
          # (the convention actions/setup-node uses) instead of ${NPM_TOKEN}.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ ! -f "package.json" ]; then
            echo "package.json not found in working directory: ${{ inputs.working_directory || inputs.app_path }}"
            exit 1
          fi

          # Resolve into a variable first: interpolating inputs.release_command
          # directly as a command body breaks the script when it's empty
          # (bash treats an empty then/elif body as a syntax error).
          RELEASE_CMD="${{ inputs.release_command }}"
          if [ -z "$RELEASE_CMD" ]; then
            if grep -q '"release"' package.json; then
              RELEASE_CMD="pnpm release"
            elif command -v npx &> /dev/null; then
              RELEASE_CMD="npx semantic-release"
            else
              echo "semantic-release not found. Please add it to your package.json scripts or install it."
              exit 1
            fi
          fi

          # Tracked so the sync-back steps below only run when semantic-release
          # actually committed a version bump (it exits 0 even when there was
          # nothing to release).
          BEFORE_SHA="$(git rev-parse HEAD)"
          eval "$RELEASE_CMD"
          AFTER_SHA="$(git rev-parse HEAD)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # semantic-release runs independently per branch (develop/staging/main),
      # each committing its own version bump (package.json/CHANGELOG.md)
      # straight to that branch with no relation to the others. Left alone,
      # develop/staging permanently diverge from main's bump commits and every
      # later promotion PR conflicts on those same lines. Syncing main back
      # down after each stable release closes that gap, mirroring the
      # sync_develop_after_stable step in docker-release.yml.
      - name: Sync stable to develop
        if: github.ref_name == 'main' && steps.semantic_release.outputs.released == 'true' && inputs.sync_develop_after_stable
        run: |
          git fetch origin main develop
          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "develop branch does not exist — skipping sync"
            exit 0
          fi
          git checkout develop
          git merge origin/main -m "chore(release): sync stable from main"
          git push origin develop

      - name: Sync stable to staging
        if: github.ref_name == 'main' && steps.semantic_release.outputs.released == 'true' && inputs.sync_staging_after_stable
        run: |
          git fetch origin main staging
          if ! git show-ref --verify --quiet refs/remotes/origin/staging; then
            echo "staging branch does not exist — skipping sync"
            exit 0
          fi
          git checkout staging
          git merge origin/main -m "chore(release): sync stable from main"
          git push origin staging
